name: Feature request
description: Suggest an idea, a new harness, or a new client.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Building a harness adapter or a client is the core contribution path;
        see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) and
        [docs/ADD_A_HARNESS.md](../blob/main/docs/ADD_A_HARNESS.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The need, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New harness adapter
        - New client
        - Core / ports
        - Telegram client
        - Android client
        - Build, packaging, or CI
        - Docs
        - Other
    validations:
      required: true
