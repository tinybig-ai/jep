name: android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the debug APK: proof the client compiles, nothing signed or shipped.
  # Debug builds need no secret; the debug key is generated on the runner.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The runner image already ships the Android SDK (ANDROID_HOME), so we
      # skip android-actions/setup-android: it now tries to install the removed
      # legacy "tools" package and fails. Accepting licenses lets AGP download a
      # platform the image happens to lack.
      - name: Accept Android SDK licenses
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$sm" ]; then yes | "$sm" --licenses >/dev/null 2>&1 || true; fi
      # -Dorg.gradle.java.home wins over android/gradle.properties, which pins
      # the maintainer's local Android Studio JDK and would not exist here.
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
      # The instrumented tests are not run here (that needs an emulator), but
      # they must at least compile: nothing built them, so FakeChatRepository
      # silently drifted out of step with the repository interface.
      - name: Compile the instrumented tests
        working-directory: android
        run: ./gradlew :app:compileDebugAndroidTestKotlin -Dorg.gradle.java.home="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
