name: android

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the debug APK: proof the client compiles, nothing signed or shipped.
  # Debug builds need no secret — the debug key is generated on the runner.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # -Dorg.gradle.java.home wins over android/gradle.properties, which pins
      # the maintainer's local Android Studio JDK and would not exist here.
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
