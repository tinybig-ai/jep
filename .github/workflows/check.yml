name: check

on:
  push:
    branches: [main]
  pull_request:

# supersede an in-flight run when a branch moves again
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `npm run check` is typecheck + the unit suite: no network, no harness, ~5s.
    # It is the same gate CONTRIBUTING asks contributors to run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  clean-machine:
    # Simulate a fresh install: build the tarball, install it in a fresh container,
    # and exercise the entry point (version, help, mock mode).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination /tmp
      - name: Run in fresh container
        uses: addnab/docker-run-action@v3
        with:
          image: node:22-alpine
          options: -v /tmp:/pkg -v ${{ github.workspace }}/fixture:/fixture -w /app
          run: |
            npm install /pkg/jep-*.tgz --omit=dev
            node node_modules/.bin/jep --version
            node node_modules/.bin/jep --help
            JEP_TG_MOCK=1 JEP_TG_PAIR_CODE=TESTCODE node node_modules/.bin/jep < /fixture/telegram-mock.jsonl
