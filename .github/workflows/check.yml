name: check

on:
  push:
    branches: [main]
  pull_request:

# supersede an in-flight run when a branch moves again
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `npm run check` is typecheck + the unit suite: no network, no harness, ~5s.
    # It is the same gate CONTRIBUTING asks contributors to run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
