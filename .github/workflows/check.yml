name: check

on:
  push:
    branches: [main]
  pull_request:

# supersede an in-flight run when a branch moves again
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `npm run check` is typecheck + the unit suite: no network, no harness, ~5s.
    # It is the same gate CONTRIBUTING asks contributors to run.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  clean-machine:
    # Simulate a fresh install: build the tarball, install it in a fresh container,
    # and exercise the entry point (version, help, mock mode). This is the CI
    # stand-in for `npx --yes github:tinybig-ai/jep` on a machine that has never
    # cloned the repo, and it is where the node_modules type-stripping wall shows up.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination /tmp
      - name: Run in fresh container
        uses: addnab/docker-run-action@v3
        with:
          image: node:22-bookworm-slim
          options: -v /tmp:/pkg -w /app
          run: |
            set -e
            npm install /pkg/tinybig-ai-jep-*.tgz --omit=dev
            node node_modules/.bin/jep --version
            node node_modules/.bin/jep --help
            # the echo harness needs nothing installed: a cold machine boots
            mkdir -p /ws
            timeout 90 env JEP_HARNESS=echo JEP_TG_MOCK=1 JEP_TG_PAIR_CODE=TESTCODE JEP_GW_PORT=18932 JEP_WORKSPACES=/ws \
              node node_modules/.bin/jep < node_modules/@tinybig-ai/jep/fixture/telegram-mock.jsonl > /tmp/mock.log 2>&1 || true
            cat /tmp/mock.log
            grep -q "mode: MOCK" /tmp/mock.log
            grep -q "Paired" /tmp/mock.log
            echo "clean-machine run OK"

  linux-unit:
    # scripts/install-linux.sh writes a systemd user unit; systemd itself checks
    # it here, since the machines it is written on (macOS) have no systemd
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Render the unit and verify it
        run: |
          set -e
          out=$(JEP_DRY_RUN=1 JEP_TG_TOKEN=0:ci sh scripts/install-linux.sh)
          mkdir -p "$HOME/.local/share/jep-tg"
          printf '%s\n' "$out" | awk '/^# .*jep-tg\.service$/{f=1;next} /^# .*jep-tg\.env/{f=0} f' > /tmp/jep-tg.service
          printf 'JEP_TG_TOKEN=0:ci\n' > "$HOME/.local/share/jep-tg/jep-tg.env"
          cat /tmp/jep-tg.service
          systemd-analyze verify /tmp/jep-tg.service
