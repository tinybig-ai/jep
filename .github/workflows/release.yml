name: release

# Push a tag like v0.2.0 to build a signed release APK and the macOS menu-bar
# app, attach both to the GitHub Release for that tag, and publish the daemon
# to npm when NPM_TOKEN is set. The signing key comes from repository secrets
# and is written to a temp file on the runner; it is never committed.
#
# One-time setup is in docs/RELEASING.md: generate a keystore, then add
# ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under
# Settings → Secrets and variables → Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The runner ships the Android SDK; android-actions/setup-android fails on
      # the removed legacy "tools" package, so we just accept licenses.
      - name: Accept Android SDK licenses
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sm=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$sm" ]; then yes | "$sm" --licenses >/dev/null 2>&1 || true; fi

      - name: Materialize the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jep-release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/jep-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble the signed release APK
        working-directory: android
        run: >
          ./gradlew :app:assembleRelease
          -Dorg.gradle.java.home="$JAVA_HOME"
          -PreleaseVersionName="${GITHUB_REF_NAME#v}"
          -PreleaseVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          asset="jep-${GITHUB_REF_NAME#v}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk#$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk#$asset" --generate-notes --title "$GITHUB_REF_NAME"
          fi

  # The macOS menu-bar app, as a zipped JepBar.app. Ad-hoc signed only (no
  # Apple Developer ID yet), so the first open is right-click → Open.
  jepbar:
    needs: apk
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] && sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Build JepBar.app
        working-directory: macos/JepBar
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/JepBar
          app=JepBar.app/Contents
          mkdir -p "$app/MacOS"
          cp "$bin" "$app/MacOS/JepBar"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>JepBar</string>
            <key>CFBundleIdentifier</key><string>ai.tinybig.jepbar</string>
            <key>CFBundleName</key><string>JepBar</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - JepBar.app
          ditto -c -k --keepParent JepBar.app "JepBar-${GITHUB_REF_NAME#v}.zip"
      - name: Attach JepBar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "macos/JepBar/JepBar-${GITHUB_REF_NAME#v}.zip" --clobber

  # The daemon on npm as @tinybig-ai/jep. Skipped until NPM_TOKEN is set.
  npm:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm publish (see docs/RELEASING.md)"
            exit 0
          fi
          [ "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" ] || {
            echo "::error::package.json version does not match $GITHUB_REF_NAME"; exit 1; }
          npm ci
          npm publish --provenance
