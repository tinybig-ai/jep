name: release

# Push a tag like v0.2.0 to build a signed release APK and attach it to the
# GitHub Release for that tag. The signing key comes from repository secrets
# and is written to a temp file on the runner; it is never committed.
#
# One-time setup is in CONTRIBUTING.md ("Release & versioning"): generate a
# keystore, then add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD under Settings → Secrets and variables → Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see CONTRIBUTING.md → Release & versioning"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jep-release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/jep-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble the signed release APK
        working-directory: android
        run: >
          ./gradlew :app:assembleRelease
          -Dorg.gradle.java.home="$JAVA_HOME"
          -PreleaseVersionName="${GITHUB_REF_NAME#v}"
          -PreleaseVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          asset="jep-${GITHUB_REF_NAME#v}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk#$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk#$asset" --generate-notes --title "$GITHUB_REF_NAME"
          fi
