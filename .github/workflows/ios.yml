name: ios

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JepKit is Foundation-only: its logic tests run on Linux in seconds.
  jepkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Test JepKit
        working-directory: ios/JepKit
        run: swift test

  # The app itself: proof it compiles for the Simulator, nothing signed.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios/Jep
        run: brew install xcodegen && xcodegen generate
      - name: Build for the Simulator
        working-directory: ios/Jep
        run: |
          xcodebuild -project Jep.xcodeproj -scheme Jep \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}
      - name: Test JepKit on iOS
        working-directory: ios/JepKit
        run: |
          xcodebuild -scheme JepKit -destination 'platform=iOS Simulator,name=iPhone 16' test | tail -n 40
          exit ${PIPESTATUS[0]}

  # Drives every screen against a canned gateway and keeps the screenshots.
  screens:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo gateway
        run: node ios/Jep/JepUITests/demo-gateway.mjs 8931 &
      - name: Generate the Xcode project
        working-directory: ios/Jep
        run: brew install xcodegen && xcodegen generate
      - name: Boot the Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d for x in d[r] if x['name']=='iPhone 16'))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid"
      - name: Screen tour
        working-directory: ios/Jep
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/shots/tour.mp4" &
          rec=$!
          sleep 2
          set +e
          xcodebuild -project Jep.xcodeproj -scheme Jep \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/tour.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test | tail -n 60
          code=${PIPESTATUS[0]}
          kill -INT $rec; wait $rec
          exit $code
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tour.xcresult" --output-path "$RUNNER_TEMP/shots"
          ls "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: ${{ runner.temp }}/shots
