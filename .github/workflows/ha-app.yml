name: ha-app

# Builds the Home Assistant app's container image for both supported
# architectures and pushes it to GHCR, so a fork can ship pulls instead of
# on-device builds. The image prefix in config.json must name the same owner.
# When publishing this integration upstream, update that prefix and repository
# metadata together; never silently switch existing fork users to local builds.
on:
  push:
    branches: [main]
    paths:
      - "homeassistant/**"
      - "src/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/smoke-ha-image.mjs"
      - ".github/workflows/ha-app.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { supervisor_arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { supervisor_arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the app version
        id: app
        run: |
          echo "version=$(jq -r .version homeassistant/config.json)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          image=$(jq -r '.image // empty' homeassistant/config.json)
          if [ -n "$image" ] && [ "$image" != "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/{arch}-jep" ]; then
            echo "::error::config.json image prefix must match this repository owner before publishing"
            exit 1
          fi

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image naming matches the `{arch}` placeholder the Supervisor accepts:
      # ghcr.io/<owner>/{arch}-jep with per-arch tags
      - name: Build the image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./homeassistant
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          # The Dockerfile's default clone is upstream. This repo's image must
          # contain this repo's source, or a fork ships a UI that never got
          # the commit just pushed.
          build-args: |
            BUILD_VERSION=${{ steps.app.outputs.version }}
            BUILD_ARCH=${{ matrix.supervisor_arch }}
            JEP_REPO=https://github.com/${{ github.repository }}
            JEP_REF=${{ github.ref_name }}
            JEP_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.app.outputs.owner }}/${{ matrix.supervisor_arch }}-jep:${{ steps.app.outputs.version }}
            ghcr.io/${{ steps.app.outputs.owner }}/${{ matrix.supervisor_arch }}-jep:latest
          labels: |
            org.opencontainers.image.title=Jep
            org.opencontainers.image.description=One interface for every coding agent: Telegram and gateway clients for opencode
            org.opencontainers.image.version=${{ steps.app.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Boot the image with default options and verify restart
        env:
          IMAGE: ghcr.io/${{ steps.app.outputs.owner }}/${{ matrix.supervisor_arch }}-jep:${{ steps.app.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/smoke-ha-image.mjs "$IMAGE" "$PLATFORM"

      - name: Push the tested image
        env:
          IMAGE: ghcr.io/${{ steps.app.outputs.owner }}/${{ matrix.supervisor_arch }}-jep
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
