<style>
  :root {
    --bg: #ffffff; --side: #f6f6f5; --line: #e6e5e3; --text: #1d1d1b; --dim: #85837f;
    --bubble: #efeeec; --accent: #c8352b; --code: #f3f2f0; --user: #a8102c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --side: #1b1b1b; --line: #2a2a2a; --text: #e8e6e3; --dim: #8b8984;
      --bubble: #262626; --accent: #e5534b; --code: #1f1f1f; --user: #8e0d25;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--bubble); }
  [hidden] { display: none !important; }

  /* the sessions */
  aside {
    width: 280px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  #sessions { overflow-y: auto; flex: 1; }
  .session { display: block; padding: 10px 14px; color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .session:hover { background: var(--bubble); }
  .session.open { background: var(--bubble); }
  .session .row { display: flex; align-items: baseline; gap: 8px; }
  .session .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .age { color: var(--dim); font-size: 12px; flex: none; }
  .session .meta { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .session .meta svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
  /* a turn running: a red dot at the row's bottom right, breathing */
  .session .live { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  .session.unread .title { font-weight: 600; }

  /* the conversation */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    border-bottom: 1px solid var(--line); min-height: 52px;
  }
  #back { display: none; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #health { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #health::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: currentColor; vertical-align: 1px; }
  #health.online { color: #2f9e44; }
  #health.warn { color: #d08a00; }
  #health.error { color: var(--accent); }
  #scroll { flex: 1; overflow-y: auto; }
  #log { max-width: 780px; margin: 0 auto; padding: 20px; }
  .older { display: block; margin: 0 auto 16px; }
  .msg { margin: 0 0 16px; position: relative; }
  .msg.user { display: flex; justify-content: flex-end; }
  /* a message's details, under it while hovered; nothing moves */
  .msg[data-info]:hover::after {
    content: attr(data-info); position: absolute; top: calc(100% + 1px); left: 0; right: 0;
    font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  .msg.user[data-info]:hover::after { text-align: right; }
  /* up and down between your own messages: a fixed spot at the row's left, and
     a jump puts the next message where this one was, so the pointer stays put */
  .msg .nav { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 2px; opacity: 0; transition: opacity .12s; }
  .msg.user:hover .nav { opacity: 1; }
  .nav button { padding: 0; width: 26px; height: 20px; line-height: 0; border-radius: 6px; color: var(--dim); }
  .nav button:hover:not(:disabled) { color: var(--text); }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .msg.user .body { background: var(--user); color: #fff; border-radius: 16px; padding: 8px 14px; max-width: 85%; }
  .retry-send {
    display: none; position: absolute; right: 0; top: calc(100% + 1px);
    border: none; padding: 0 4px; border-radius: 4px; color: var(--dim);
    background: none; font-size: 11px; line-height: 1.55; text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .msg.user:hover .retry-send { display: inline-block; }
  .retry-send:hover { color: var(--text); background: none; }
  .msg.user[data-info]:hover::after { right: 42px; }
  .msg.user .text a { color: #fff; }
  .msg.user details { color: #fffc; }
  /* the harness folded the conversation: a divider across the log, not a
     bubble. The marker is an empty user message otherwise. */
  .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: var(--dim); font-size: 12px; }
  .divider .line { flex: 1; height: 1px; background: var(--line); }
  .divider.quiet { font-size: 11px; opacity: .75; }
  .text { overflow-wrap: anywhere; }
  .text.plain { white-space: pre-wrap; }
  .text > :first-child { margin-top: 0; }
  .text > :last-child { margin-bottom: 0; }
  .text p, .text ul, .text ol, .text blockquote, .text .table, .text pre { margin: 0 0 .7em; }
  .text ul, .text ol { padding-left: 1.4em; }
  .text li { margin: .15em 0; }
  .text li > p { margin: 0; }
  .text h1, .text h2, .text h3, .text h4 { margin: 1em 0 .4em; line-height: 1.3; }
  .text h1 { font-size: 1.35em; } .text h2 { font-size: 1.2em; } .text h3 { font-size: 1.05em; } .text h4 { font-size: 1em; }
  .text blockquote { padding-left: 12px; border-left: 3px solid var(--line); color: var(--dim); }
  .text hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .text .table { overflow-x: auto; }
  .text table { border-collapse: collapse; font-size: 14px; }
  .text th, .text td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .text th { background: var(--code); font-weight: 600; }
  .text input[type=checkbox] { margin: 0 6px 0 0; vertical-align: middle; }
  .text li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.2em; }
  .msg.user .text th, .msg.user .text td { border-color: #fff4; }
  .msg.user .text th { background: #0002; }
  .text pre { white-space: pre; overflow-x: auto; background: var(--code); padding: 10px 12px; border-radius: 8px; }
  .text code { font: 13px ui-monospace, Menlo, monospace; background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .text pre code { padding: 0; background: none; }
  .text a { color: var(--accent); }
  details { color: var(--dim); font-size: 13px; margin: 2px 0; }
  summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.assistant:has(> details) { margin-bottom: 8px; }
  details.work > summary { font-weight: 500; }
  details.work.active > summary { color: var(--text); }
  details.work.failed > summary { color: var(--accent); }
  .toolhead { display: flex; align-items: baseline; gap: 6px; min-width: 0; }

<script>
"use strict"
// crypto.randomUUID exists only on secure pages (https or localhost); over
// http://<lan-ip> it is missing and sending would throw, so fall back
const uuid = () => crypto.randomUUID?.() ?? ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) =>
  (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16))
const $ = (id) => document.getElementById(id)
const PAGE = 60

// ── talking to the gateway ────────────────────────────────────────────────
let token = localStorage.getItem("jep.token")
let healthTimer = null

function setHealth(kind, label, detail = label) {
  const n = $("health")
  if (!n) return
  n.className = kind
  n.textContent = label
  n.title = detail
  const daemon = $("daemonStatus")
  if (daemon) daemon.textContent = detail
}

async function call(path, body = {}) {
  let res
  try {
    res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    })
  } catch {
    setHealth("error", "Offline", "Cannot reach the jep gateway")
    throw new Error("Cannot reach the jep gateway")
  }
  if (res.status === 401) { setHealth("error", "Pair again", "This browser is no longer paired"); unpair("This browser is no longer paired."); throw new Error("pair first") }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    const message = data.error || `${path} failed (${res.status})`
    if (/api key|authentication|unauthorized|expired|credential/i.test(message)) setHealth("error", "Agent auth error", message)
    throw new Error(message)
  }
  setHealth("online", "Connected", "Gateway connected")
  return data
}

async function loadHealth() {
  try {
    const res = await fetch("/health", { cache: "no-store" })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || !data.ok) throw new Error("gateway unavailable")
    if (token) setHealth("online", "Connected", `Gateway online · ${data.devices ?? 0} device${data.devices === 1 ? "" : "s"}${data.pushConfigured ? " · push enabled" : ""}`)
    else setHealth("warn", "Pair required", "Enter the pairing code to connect this browser")
  } catch {
    if (token) setHealth("error", "Offline", "Cannot reach the jep gateway")
  }
}

function unpair(message = "") {
  token = null
  localStorage.removeItem("jep.token")
  $("pairError").textContent = message
  show()
}

$("pair").onsubmit = async (e) => {
  e.preventDefault()
  const res = await fetch("/pair", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ code: $("code").value.trim() }),
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) return void ($("pairError").textContent = data.error || "pairing failed")
  token = data.token
  localStorage.setItem("jep.token", token)
  $("pairError").textContent = ""
  show()
}

// ── state ─────────────────────────────────────────────────────────────────
let sessions = []
let current = null        // the open session's id
let messages = []         // its history, oldest first
let asks = []             // its pending asks
let etag = null
let hasMore = false
let loadingOlder = false
let live = new Map()      // partID → { messageID, part } streamed since the last read
const roles = new Map()   // messageID → role, as the feed announces them
const sending = new Map() // session → prompts of ours still in flight
let pendingText = []      // sends the record does not show yet
let queue = []            // the daemon's prompts waiting behind the running turn, in order
let loop = null           // the loop this conversation is running, if any
let attachments = []      // files uploaded for the next prompt
const attachmentsOf = new Map() // conversation → its attachments while another is open
const ATTACH_MAX = 1 * 1024 * 1024 * 1024

// ── the session list ──────────────────────────────────────────────────────
const announced = new Set()   // late workspaces already reported this visit

let listing = null
let listAgain = false

// One list request at a time. A call that arrives while one is running asks
// for one more read after it, because the running one may have started before
// the news (a turn that just ended) and would answer with the old state.
function loadSessions() {
  if (listing) {
    listAgain = true
    return listing
  }
  listing = listSessions().finally(() => {
    listing = null
    if (listAgain) {
      listAgain = false
      loadSessions().catch(() => {})
    }
  })
  return listing
}

async function listSessions() {
  const { items, degraded = [] } = await call("/sessions")
  // A workspace that missed the listing time limit is missing from this answer,
  // not empty: keep the rows it had last time rather than drop them.
  const late = new Set(degraded.map((d) => d.name + "/" + d.harness))
  const fresh = new Set(items.map((s) => s.id))
  const kept = sessions.filter((s) => late.has(s.adapter + "/" + s.harness) && !fresh.has(s.id))
  sessions = [...items, ...kept].sort((x, y) => Number(y.pinned) - Number(x.pinned) || y.updatedAt - x.updatedAt)
  // say it once per workspace per visit: a slow harness stays slow, and the
  // refresh every few seconds would otherwise repeat it each time
  const news = degraded.filter((d) => !announced.has(d.name + "/" + d.harness))
  news.forEach((d) => announced.add(d.name + "/" + d.harness))
  if (news.length) fail(new Error(`Could not refresh the conversations in ${news.map((d) => `${d.name} (${d.harness})`).join(", ")} in time. Showing the last ones known.`))
  remember("jep.sessions", JSON.stringify(sessions))
  renderSessions()
  // whether the open conversation is busy can have changed with the list
  if (current) frame()
  // a conversation opened before the list came has its title now
  if (current && !$("title").textContent) $("title").textContent = sessions.find((s) => s.id === current)?.title || ""
}

function harnessMark(h) {
  const icon = HARNESS_ICONS[h]
  if (!icon) return el("span", "", h)
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
  svg.setAttribute("viewBox", `0 0 ${icon[0]} ${icon[0]}`)
  const title = document.createElementNS("http://www.w3.org/2000/svg", "title")
  title.textContent = h
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path")
  path.setAttribute("d", icon[1])
  svg.append(title, path)
  return svg
}

function renderSessions() {
  $("sessions").replaceChildren(...sessions.map((s) => {
    const unread = s.id !== current && s.updatedAt > (s.seenAt || 0)
    const a = el("a", "session" + (s.id === current ? " open" : "") + (unread ? " unread" : ""))
    a.href = "#" + encodeURIComponent(s.id)
    const row = el("div", "row")
    row.append(el("div", "title", s.title || "untitled"), el("div", "age", ago(s.updatedAt)))
    const meta = el("div", "meta")
    if (s.pinned) meta.append("📌")
    meta.append(harnessMark(s.harness), s.adapter)
    if (s.active) {
      const dot = el("span", "live")
      dot.title = "Working"
      meta.append(dot)
    }
    const del = el("button", "icon del")
    del.title = "Delete conversation"
    del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
    del.onclick = (e) => { e.preventDefault(); e.stopPropagation(); remove(s) }
    a.append(row, meta, del)
    return a
  }))
}

// A conversation is made in a folder under a harness, chosen apart: the gateway
// brings a harness up for a folder it does not serve under it yet. A pod is a
// throwaway folder the daemon makes. The last choice is remembered.
async function loadWorkspaces() {
  const [{ items }, { harnesses, default: fallback }] = await Promise.all([call("/workspaces"), call("/harnesses")])
  const dirs = new Map(items.filter((w) => !w.pod).map((w) => [w.dir, w.name]))
  // a folder picked with Other last time is offered by name from then on
  const last = remembered("jep.folder")
  if (last && last !== OTHER && !dirs.has(last)) dirs.set(last, last.split("/").pop())
  const other = el("option", "", "Other…")
  other.value = OTHER
  $("folder").replaceChildren(...[...dirs].map(([dir, name]) => {
    const o = el("option", "", name)
    o.value = dir; o.title = dir
    return o
  }), other)
  $("harness").replaceChildren(...harnesses.map((h) => {
    const label = el("label")
    const radio = el("input")
    radio.type = "radio"; radio.name = "harness"; radio.value = h
    label.append(radio, el("span", "", h))
    return label
  }))
  // a remembered choice only while it is still on offer. A pod is its own
  // choice; the folder last used stays the folder default under it.
  // (An empty remembered folder is how a pod used to be remembered.)
  const pod = remembered("jep.where") === "pod" || remembered("jep.folder") === ""
  $("start").querySelector(`input[name=where][value=${pod ? "pod" : "folder"}]`).click()
  const folder = remembered("jep.folder")
  if (folder != null && [...$("folder").options].some((o) => o.value === folder)) $("folder").value = folder
  const want = remembered("jep.harness")
  const radio = (h) => $("start").querySelector(`input[value="${CSS.escape(h ?? "")}"]`)
  ;(radio(want) ?? radio(fallback) ?? $("start").querySelector("input[name=harness]"))?.click()
}

// Other: walk the folders under the browse root; the folder shown is the one used
const OTHER = "\u0001other"
let browsed = null

async function browse(path) {
  const { cwd, parent, dirs } = await call("/browse", path ? { path } : {})
  browsed = cwd
  // the box clips from the left so the end of the path shows; the mark keeps the slashes in place
  $("cwd").textContent = "\u200e" + cwd
  $("cwd").title = cwd
  $("up").disabled = !parent
  $("up").onclick = () => browse(parent).catch((err) => fail(err, () => browse(parent)))
  $("dirs").replaceChildren(...dirs.map((d) => {
    const b = el("button", "", (d.git ? "⎇ " : "") + d.name)
    b.type = "button"
    const path = `${cwd}/${d.name}`
    b.onclick = () => browse(path).catch((err) => fail(err, () => browse(path)))
    return b
  }))
}

for (const r of document.querySelectorAll("input[name=where]")) r.onchange = () => { $("folderField").hidden = r.value === "pod" && r.checked }

$("folder").onchange = () => {
  $("browse").hidden = $("folder").value !== OTHER
  if (!$("browse").hidden && !browsed) browse().catch((err) => fail(err, browse))
}

$("start").onsubmit = async (e) => {
  e.preventDefault()
  const pod = $("start").querySelector("input[name=where]:checked").value === "pod"
  const path = pod ? null : $("folder").value === OTHER ? browsed : $("folder").value
  if (!pod && !path) return
  const harness = $("start").querySelector("input[name=harness]:checked")?.value
  $("newChat").disabled = true
  try {
    const { session } = await call("/new", pod ? { pod: true, harness } : { path, harness })
    remember("jep.where", pod ? "pod" : "folder")
    if (!pod) remember("jep.folder", path)
    remember("jep.harness", harness)
    await loadSessions()
    location.hash = encodeURIComponent(session.id)
  } catch (err) {
    fail(err)
  } finally {
    $("newChat").disabled = false
  }
}

// ── one conversation ──────────────────────────────────────────────────────
async function open(id) {
  endEdit()
  saveDraft()
  if (current) attachmentsOf.set(current, attachments)
  current = id === "new" ? null : id
  $("start").hidden = id !== "new"
  $("scroll").hidden = id === "new"
  messages = []; asks = []; etag = null; hasMore = false; loadingOlder = false; live = new Map(); pendingText = []; queue = []
  loop = null; renderLoop()
  $("input").value = (current && remembered(draftKey(current))) || ""
  grow()
  // like the draft, a conversation's attachments wait for it
  attachments = (current && attachmentsOf.get(current)) || []
  renderAttachments()
  document.body.classList.toggle("chatting", !!id)
  renderSessions()
  $("title").textContent = sessions.find((s) => s.id === id)?.title || ""
  $("log").replaceChildren()
  $("compose").hidden = !current
  $("stop").hidden = true
  $("menu").hidden = true
  choices = null; usage = null
  if (!current) return
  markSeen()
  loadStatus()
  await readHistory()
  $("input").focus()
}

// the newest page; older messages already loaded are kept in front of it
async function readHistory() {
  const id = current
  if (!id) return
  const data = await call("/history", { id, limit: PAGE, etag })
  if (id !== current || data.unchanged) return
  const first = data.messages[0]?.time ?? Infinity
  messages = [...messages.filter((m) => m.time < first), ...data.messages]
  if (!messages.some((m) => m.time < first)) hasMore = data.hasMore
  asks = data.asks.filter((a) => a.state === "pending")
  queue = data.queue ?? []
  loop = data.loop ?? null
  for (const p of pendingText) {
    if (!p.expectQueue) continue
    if (queue.some((q) => q.clientID === p.clientID)) p.seenInQueue = true
    else if (p.seenInQueue || Date.now() - (p.sentAt || 0) > 2000) p.expectQueue = false
  }
  etag = data.etag
  renderLoop()
  // prompts that waited together run as one turn, their words joined by blank
  // lines: a send is in the record once it is one of those pieces, said since
  const joined = messages.filter((m) => m.role === "user" && m.time).map((m) => ({ time: m.time, pieces: new Set(textOf(m).split("\n\n").map((t) => t.trim())) }))
  // (an earlier message with the same words is not this one: "go on" twice)
  const now = Date.now()
  pendingText = pendingText.filter((p) => !(p.sentAt && joined.some((m) => m.time >= p.sentAt - 5000 && (m.pieces.has(p.text.trim()) || [...m.pieces].join("\n\n") === p.text.trim())))
    && !(p.answeredAt && now - p.answeredAt > 15_000))
  const seen = new Set(messages.flatMap((m) => [m.id, ...m.parts.map((p) => p.id)]))
  for (const [pid, l] of live) if (seen.has(pid) || seen.has(l.messageID)) live.delete(pid)
  render()
}

async function loadOlder() {
  if (loadingOlder || !hasMore || !current) return false
  const id = current
  const before = messages[0]?.time
  const scroller = $("scroll")
  const fromBottom = scroller.scrollHeight - scroller.scrollTop
  let loaded = false
  loadingOlder = true
  render(false)
  try {
    const data = await call("/history", { id, limit: PAGE, before, have: messages.length })
    if (id !== current) return false
    messages = [...data.messages.filter((m) => m.time < before), ...messages]
    hasMore = data.hasMore
    loaded = true
    return true
  } catch (err) {
    fail(err, loadOlder)
    return false
  } finally {
    loadingOlder = false
    if (id === current) {
      render(false)
      if (loaded) scroller.scrollTop = scroller.scrollHeight - fromBottom
    }
  }
}

const busy = () => (sending.get(current) || 0) > 0 || live.size > 0 || !!sessions.find((s) => s.id === current)?.active

// The turn is over: nothing of it is in flight any more, whatever this page
// still holds. A send request can outlive its turn on the wire (a Mac asleep,
// a network change) and a list read can be older than the end, so neither is
// waited on, as the phone does not wait on them either.
function settle(id) {
  sending.delete(id)
  const s = sessions.find((x) => x.id === id)
  if (s) s.active = false
  if (id === current) live.clear()
}

function render(follow = true) {
  const scroller = $("scroll")
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80
  const nodes = []
  if (hasMore) {
    const b = el("button", "older", loadingOlder ? "Loading…" : "Load older")
    b.disabled = loadingOlder
    b.onclick = loadOlder
    nodes.push(b)
  }
  // queued as soon as it is sent into a running turn, before the daemon's
  // line confirms it; it leaves once it has left that line
  const inQueue = (p) => queue.some((q) => q.clientID && q.clientID === p.clientID) || !!p.expectQueue
  const all = [
    ...messages,
    ...pendingText.filter((p) => !inQueue(p)).map((p) => ({ role: "user", parts: [{ kind: "text", text: p.text }], undelivered: p.failed, retry: p.retry })),
    ...(live.size ? [{ role: "assistant", id: [...live.values()][0].messageID, parts: [...live.values()].map((l) => l.part), live: true }] : []),
    // what waits for the next turn comes after the reply running now
    ...pendingText.filter(inQueue).map((p) => {
      const queued = queue.find((q) => q.clientID && q.clientID === p.clientID) ?? { clientID: p.clientID, steer: p.steer }
      return { role: "user", parts: [{ kind: "text", text: p.text }], queued }
    }),
    // waiting in the daemon's line from another device: shown the same way
    ...queue.filter((q) => !pendingText.some((p) => p.clientID && p.clientID === q.clientID)).map((q) => ({ role: "user", parts: [{ kind: "text", text: q.text }], queued: q })),
  ]
  nodes.push(...transcript(all))
  for (const a of asks) nodes.push(askNode(a))
  if (busy() && !asks.length) nodes.push(el("div", "spin", "working"))
  // A box that scrolls on its own (a turn's work, a tool's output) is a new
  // box after every redraw, and a new box starts at the top: whoever was
  // reading deep inside one was thrown back to its beginning every few
  // seconds. Each is named; the new one takes the old one's place.
  const scrolled = new Map()
  for (const n of $("log").querySelectorAll("[data-keep]")) if (n.scrollTop || n.scrollLeft) scrolled.set(n.dataset.keep, [n.scrollTop, n.scrollLeft])
  $("log").replaceChildren(...nodes)
  for (const n of $("log").querySelectorAll("[data-keep]")) {
    const at = scrolled.get(n.dataset.keep)
    if (at) [n.scrollTop, n.scrollLeft] = at
  }
  $("stop").hidden = !busy()
  $("modes").hidden = !busy()
  renderQueue()
  renderStatus()
  if (follow && atBottom) scroller.scrollTop = scroller.scrollHeight
}

// Work is a turn's tool calls and thinking. A stretch of it with nothing said
// in between folds into one line titled by what is inside ("Worked for 1m 13s ·
// ran 4 commands, read 2 files"), as the phone shows it. A lone call or
// thought stays itself.
// an edit is not folded away: what changed in the files is the point of a turn
const isWork = (p) => (p.kind === "tool" && !isEdit(p)) || (p.kind === "reasoning" && p.text.trim())
const isEdit = (p) => !!editsOf(p.name.toLowerCase(), typeof p.input === "object" && p.input ? p.input : {})

// opencode folds the history and writes a synthetic user message whose only
// part is the compaction marker; the summarize reply that answers it arrives as
// the assistant message right after. The marker is the boundary between the
// folded history and what follows, so it settles below that reply and right
// before the next user turn. Drawn where it arrives, it is an empty user bubble
// above the very words the compaction produced.
const isCompactionPart = (p) => p.kind === "other" && p.nativeType === "compaction"
const isAutoContinuePart = (p) => p.kind === "other" && p.nativeType === "compaction-continue"
const isCompactionOnly = (m) => m.parts.length === 1 && isCompactionPart(m.parts[0])
const isAutoContinueOnly = (m) => m.parts.length === 1 && isAutoContinuePart(m.parts[0])
const saysNothing = (m) => m.role === "user" && !m.parts.some((p) => (p.kind === "text" && p.text.trim()) || p.kind === "quote" || p.kind === "file")

// The auto-continue prompt is the next turn the divider settles against, so it
// releases a held marker even though it is scaffolding, not words a person typed.
function settleCompaction(all) {
  if (!all.some(isCompactionOnly)) return all
  const out = []
  let held = null
  for (const m of all) {
    if (isCompactionOnly(m)) { held = m; continue }
    if (held && m.role === "user") { out.push(held); held = null }
    out.push(m)
  }
  if (held) out.push(held)
  return out
}

function dividerNode(label, quiet = false) {
  const node = el("div", "divider" + (quiet ? " quiet" : ""))
  node.append(el("span", "line"), el("span", "label", label), el("span", "line"))
  return node
}
const compactionNode = () => dividerNode("compaction complete")
const autoContinueNode = () => dividerNode("· auto-continued ·", true)
const loopNode = (l) => dividerNode(`loop ${l.iteration}/${l.max}`, true)

function transcript(all) {
  const out = []
  let run = []
  const flush = (last = false) => {
    if (run.length === 1) out.push(assistant(workItem(run[0].p)))
    else if (run.length > 1) out.push(assistant(workFold(run, last && busy())))
    run = []
  }
  for (const m of settleCompaction(all)) {
    if (m.role === "user") {
      flush()
      if (isCompactionOnly(m)) { out.push(compactionNode()); continue }
      if (isAutoContinueOnly(m)) { out.push(autoContinueNode()); continue }
      if (m.loop) { out.push(loopNode(m.loop)); continue }
      if (saysNothing(m)) continue
      const node = messageNode("user", m.parts, m.queued ? null : m.retry || (() => retryMessage(m)), m.id)
      node.prepend(userNav(node))
      if (m.time) node.dataset.info = when(m.time)
      if (m.queued) queuedMark(node, m.queued)
      out.push(node)
      continue
    }
    const before = out.length
    for (const p of m.parts) {
      if (isWork(p)) run.push({ p, m })
      else if (p.kind === "tool") {
        flush()
        out.push(assistant(toolNode(p)))
      } else if (shows(p)) {
        flush()
        out.push(messageNode("assistant", [p], null, m.id))
      }
    }
    // a reply's details ride on the last thing it said
    if (out.length > before && !run.length) out[out.length - 1].dataset.info = replyInfo(m)
  }
  flush(true)
  return out
}

// "14:32 · claude-opus-5-5 · 1m 13s · 171k in, 300 out · $0.42", whatever the harness reported
function replyInfo(m) {
  const t = m.tokens
  return [
    m.time && when(m.time),
    m.model && short(m.model),
    m.durationMs >= 1000 && span(m.durationMs),
    t && `${tokens(t.input + t.cache.read + t.cache.write)} in, ${tokens(t.output + t.reasoning)} out`,
    typeof m.cost === "number" && m.cost > 0 && "$" + m.cost.toFixed(m.cost < 0.01 ? 4 : 2),
  ].filter(Boolean).join(" · ")
}

// today's messages by the clock alone, older ones with their day
function when(t) {
  const d = new Date(t)
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  return d.toDateString() === new Date().toDateString() ? time : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time
}

const ARROW = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`
function userNav(node) {
  const nav = el("div", "nav")
  for (const [dir, path, label] of [[-1, "M6 15l6-6 6 6", "Previous message of yours"], [1, "M6 9l6 6 6-6", "Next message of yours"]]) {
    const b = el("button")
    b.type = "button"; b.title = label; b.setAttribute("aria-label", label)
    b.innerHTML = ARROW(path)
    b.onclick = () => jump(node, dir)
    nav.append(b)
  }
  // the ends of the conversation have nowhere to go
  requestAnimationFrame(() => {
    const mine = [...document.querySelectorAll("#log .msg.user")]
    const i = mine.indexOf(node)
    nav.children[0].disabled = i <= 0 && !hasMore
    nav.children[1].disabled = i === mine.length - 1
  })
  return nav
}

// Scroll by exactly the distance between the two messages, so the target lands
// where this one was and its buttons sit under the pointer. At the top with
// more history to load, load it first and keep going.
async function jump(node, dir) {
  let mine = [...document.querySelectorAll("#log .msg.user")]
  let i = mine.indexOf(node)
  if (dir < 0 && i === 0 && hasMore) {
    const scroller = $("scroll")
    const keep = node.getBoundingClientRect().top
    await loadOlder()
    // loadOlder re-renders; find this message again and put it back under the pointer
    mine = [...document.querySelectorAll("#log .msg.user")]
    i = mine.findIndex((n) => n.dataset.info === node.dataset.info && n.textContent === node.textContent)
    if (i >= 0) scroller.scrollTop += mine[i].getBoundingClientRect().top - keep
    node = mine[i]
  }
  const target = mine[i + dir]
  if (!node || !target) return
  $("scroll").scrollTop += target.getBoundingClientRect().top - node.getBoundingClientRect().top
}

const shows = (p) => (p.kind === "text" && p.text.trim()) || p.kind === "quote" || p.kind === "file"

function assistant(child) {
  const node = el("div", "msg assistant")
  node.append(child)
  return node
}

function workFold(run, active) {
  const parts = run.map((r) => r.p)
  const timed = [...new Set(run.map((r) => r.m))].filter((m) => m.time)
  const span = timed.length ? Math.max(...timed.map((m) => m.time + (m.durationMs || 0))) - Math.min(...timed.map((m) => m.time)) : 0
  const failed = parts.some((p) => p.status === "error")
  const d = keep(el("details", "work" + (failed ? " failed" : "") + (active ? " active" : "")), "work:" + (parts[0].id || ""))
  d.append(el("summary", "", workTitle(parts, span, active)))
  const body = el("div", "workbody")
  body.dataset.keep = "wb:" + (parts[0].id || "")
  for (const p of parts) body.append(workItem(p))
  d.append(body)
  return d
}

function workItem(p) {
  if (p.kind === "reasoning") {
    const key = "r:" + (p.id || p.text.slice(0, 40))
    const d = keep(fold(p.durationMs >= 1000 ? `Thought for ${span(p.durationMs)}` : "Thought", p.text), key)
    const pre = d.querySelector("pre")
    if (pre) pre.dataset.keep = key
    return d
  }
  return toolNode(p)
}

const VERB = { read: "read", edit: "edited", write: "wrote", bash: "ran", grep: "searched", glob: "found", list: "listed", patch: "patched", multiedit: "edited", "multi-edit": "edited" }
const NOUN = { read: "file", edit: "file", write: "file", patch: "file", multiedit: "file", "multi-edit": "file", bash: "command", grep: "search", glob: "match" }

function workTitle(parts, ms, active) {
  const tools = parts.filter((p) => p.kind === "tool")
  if (!tools.length) return active ? "Thinking" : ms >= 1000 ? `Thought for ${span(ms)}` : "Thought"
  const counts = {}
  for (const t of tools) { const k = t.name.toLowerCase(); counts[k] = (counts[k] || 0) + 1 }
  const said = Object.entries(counts).map(([k, n]) => {
    const noun = NOUN[k] || "call"
    return `${VERB[k] || k} ${n} ${n === 1 ? noun : noun.endsWith("ch") ? noun + "es" : noun + "s"}`
  }).join(", ")
  if (active) return `Working · ${said}`
  if (ms >= 1000) return `Worked for ${span(ms)} · ${said}`
  return said[0].toUpperCase() + said.slice(1)
}

// 42s, 1m 13s, 2h 5m
function span(ms) {
  const s = Math.floor(ms / 1000)
  if (s < 60) return `${s}s`
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`
  return `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`
}

// every render rebuilds the log; a fold someone opened stays open
const opened = new Map()
function keep(d, key, open = false) {
  d.open = opened.get(key) ?? open
  d.ontoggle = () => opened.set(key, d.open)
  return d
}

function messageNode(role, parts, retry, messageID) {
  const node = el("div", "msg " + role)
  const body = el("div", "body")
  for (const p of parts) {
    if (p.kind === "text" && p.text.trim()) body.append(textNode(p.text, messageID, role === "assistant"))
    else if (p.kind === "quote") body.append(fold("↪ " + p.text.slice(0, 80), p.text))
    else if (p.kind === "file") body.append(fileNode(p))
  }
  if (retry) {
    node.classList.add("undelivered")
    const b = el("button", "retry-send", "Retry")
    b.type = "button"
    b.onclick = () => {
      b.disabled = true
      retry().catch(fail)
    }
    body.append(b)
  }
  node.append(body)
  return node
}

function bytes(n) {
  if (n < 1024) return `${n} B`
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`
  if (n >= 1024 * 1024 * 1024) return `${(n / (1024 * 1024 * 1024)).toFixed(1)} GB`
  return `${(n / (1024 * 1024)).toFixed(1)} MB`
}

// A loop is visible over the composer while it runs, and once it is over it
// stays until dismissed, so a stop or an exhausted cap is not a silent thing.
function renderLoop() {
  const bar = $("loopBar")
  const running = loop?.status === "running"
  const turn = loop ? Math.min(loop.spec.max, loop.iteration + (running ? 1 : 0)) : 0
  const state = $("loopState")
  if (state) {
    const bits = loop ? [loop.status, `${turn}/${loop.spec.max}`, loop.spec.goal] : ["No loop."]
    if (loop?.lastVerify && loop.lastVerify.code !== null && loop.lastVerify.code !== 0) bits.push(`verify exit ${loop.lastVerify.code}`)
    if (loop?.error) bits.push(loop.error)
    state.textContent = bits.join(" · ")
    $("loopStart").disabled = running
    $("loopGoal").disabled = running
    $("loopVerify").disabled = running
    $("loopMax").disabled = running
  }
  if (!bar) return
  bar.hidden = !loop
  if (!loop) return
  const label = running ? `Loop ${turn}/${loop.spec.max}` : `Loop ${loop.status} · ${loop.iteration}/${loop.spec.max}`
  const detail = running ? (loop.iteration ? "working" : "starting") : (loop.error || loop.spec.goal)
  const text = el("span", "grow", detail)
  text.title = detail
  const action = el("button", "", running ? "Stop" : "Dismiss")
  action.type = "button"
  action.onclick = async () => {
    action.disabled = true
    try {
      await call(running ? "/loop/stop" : "/loop/clear", { id: current })
      etag = null
      await readHistory()
    } catch (err) { fail(err) } finally { action.disabled = false }
  }
  bar.replaceChildren(el("strong", "", label), text, action)
}

function renderAttachments() {
  const box = $("attachments")
  if (!box) return
  box.hidden = !attachments.length
  box.replaceChildren(...attachments.map((file, i) => {
    const chip = el("div", "attachment" + (file.error ? " error" : ""))
    chip.title = file.error || file.name
    chip.append(el("span", "", file.name))
    if (file.uploading) chip.append(el("small", "", "Uploading…"))
    else if (file.error) chip.append(el("small", "", file.error))
    else chip.append(el("small", "", bytes(file.size)))
    const remove = el("button", "", "×")
    remove.type = "button"
    remove.title = "Remove attachment"
    remove.onclick = () => { attachments.splice(i, 1); renderAttachments() }
    chip.append(remove)
    return chip
  }))
  $("send").disabled = attachments.some((file) => file.uploading)
}

async function uploadAttachments(files) {
  const id = current
  // this conversation's list, which keeps filling while another one is open
  const list = attachments
  for (const file of files) {
    const item = { name: file.name, size: file.size, id: null, uploading: false, error: "" }
    if (file.size > ATTACH_MAX) {
      item.error = "Too large"
      list.push(item)
      renderAttachments()
      continue
    }
    item.uploading = true
    list.push(item)
    renderAttachments()
    try {
      const res = await fetch(`/attach?id=${encodeURIComponent(id)}&name=${encodeURIComponent(file.name)}`, {
        method: "POST",
        headers: { authorization: `Bearer ${token}`, "content-type": file.type || "application/octet-stream" },
        body: file,
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || `Attachment failed (${res.status})`)
      item.id = data.id
      item.name = data.name || item.name
    } catch (err) {
      item.error = String(err.message || err)
      if (id === current) fail(err)
    } finally {
      item.uploading = false
      if (id === current) renderAttachments()
    }
  }
}

function sendPending(id, pending, how, throwOnFailure = false) {
  const send = (retry = false) => {
    pending.failed = false
    pending.retry = () => send(true)
    sending.set(id, (sending.get(id) || 0) + 1)
    render()
    const files = pending.files?.length ? { files: pending.files } : {}
    pending.clientID = uuid()
    pending.sentAt = Date.now()
    // the queue shows it once the daemon has it in line
    if (pending.expectQueue) setTimeout(() => { if (id === current) readHistory().catch(() => {}) }, 300)
    return call("/prompt", { id, text: pending.text, clientID: pending.clientID, ...how, ...files })
      .then((r) => {
        // Answered is not yet in the record: the harness writes the message a
        // little after, and dropping the bubble here left a gap where it was
        // nowhere. It stays until the record shows it; a stopped-for-good one
        // goes now, and anything else after 15s at most.
        if (r?.cancelled) pendingText = pendingText.filter((p) => p !== pending)
        else {
          pending.answeredAt = Date.now()
          setTimeout(() => { if (id === current) { etag = null; readHistory().catch(() => {}) } }, 15_500)
        }
        if (id === current) etag = null
      })
      .catch((err) => {
        if (id === current) {
          pending.failed = true
          render()
          fail(err)
          if (retry || throwOnFailure) throw err
        }
      })
      .finally(() => {
        if (sending.has(id)) sending.get(id) > 1 ? sending.set(id, sending.get(id) - 1) : sending.delete(id)
        if (id === current) readHistory().catch((err) => fail(err, readHistory))
      })
  }
  pending.retry = () => send(true)
  return send()
}

function retryMessage(m) {
  const text = textOf(m)
  if (!current || !text) return Promise.resolve()
  const pending = { text, id: uuid(), failed: false, retry: null }
  pendingText.push(pending)
  return sendPending(current, pending, {}, true)
}

// A tool call reads as one line, as on the phone: "Edited claude.ts +12 -3",
// "Ran" and the command. Opened, an edit is its diff and anything else its
// output, never the call's raw JSON.
function toolNode(p) {
  const name = p.name.toLowerCase()
  const args = typeof p.input === "object" && p.input ? p.input : {}
  const arg = (...keys) => keys.map((k) => args[k]).find((v) => typeof v === "string")
  const file = (arg("file_path", "filePath", "path") || p.title || "").split("/").pop()
  const edits = editsOf(name, args)
  const diff = edits && edits.flatMap(([old, now]) => [...lines(old).map((l) => "-" + l), ...lines(now).map((l) => "+" + l)])

  const head = el("span", "toolhead")
  const verb = edits ? (name === "write" ? "Wrote " : "Edited ") + (file || "a file")
    : name === "read" ? "Read " + (file || "a file")
    : name === "bash" || name === "run" ? "Ran"
    : "Used " + p.name
  head.append(el("span", "verb", verb))
  if (diff) {
    const added = diff.filter((l) => l[0] === "+").length
    const removed = diff.length - added
    if (added) head.append(el("span", "added", "+" + added))
    if (removed) head.append(el("span", "removed", "-" + removed))
  }
  const subject = name === "bash" || name === "run" ? arg("command") || p.title
    : ["grep", "glob", "search"].includes(name) ? arg("pattern") || p.title
    : !edits && name !== "read" ? p.title : null
  if (subject) head.append(el("code", "subject", subject.split("\n")[0]))
  head.classList.toggle("running", p.status === "running" || p.status === "pending")
  head.classList.toggle("failed", p.status === "error")

  const body = diff ? diffNode(diff, langOf(file)) : outputNode(p, name, arg("command"))
  if (body) body.dataset.keep = "t:" + p.id
  if (!body) {
    const line = el("div", "tool")
    line.append(head)
    return line
  }
  const d = keep(el("details", "tool"), "t:" + p.id, !!diff)
  const summary = el("summary")
  summary.append(head)
  d.append(summary, body)
  return d
}

// the old and new text of each change an edit call carries, in either harness's spelling
function editsOf(name, a) {
  const pair = (o) => [o.old_string ?? o.oldString ?? "", o.new_string ?? o.newString ?? ""]
  if (name === "write") return typeof a.content === "string" ? [["", a.content]] : null
  if (name === "edit") return "old_string" in a || "oldString" in a ? [pair(a)] : null
  if (name === "multiedit" || name === "multi-edit") return Array.isArray(a.edits) ? a.edits.map(pair) : null
  return null
}

const lines = (t) => (t ? String(t).split("\n") : [])

function diffNode(diff, lang) {
  const pre = el("pre", "diff")
  pre.append(...diff.slice(0, 2000).map((l) => {
    const row = el("div", l[0] === "+" ? "added" : "removed")
    row.innerHTML = esc(l[0]) + highlighted(l.slice(1), lang)
    return row
  }))
  return pre
}

// Code colors, when highlight.js has loaded (it is a separate file, so the page
// never waits on it). A language it does not know is plain text, escaped.
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
function highlighted(code, lang) {
  if (!window.hljs || !lang || !hljs.getLanguage(lang)) return esc(code)
  try { return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value } catch { return esc(code) }
}
const EXT = { ts: "typescript", tsx: "typescript", mts: "typescript", js: "javascript", mjs: "javascript", jsx: "javascript", kt: "kotlin", kts: "kotlin", py: "python", sh: "bash", zsh: "bash", md: "markdown", json: "json", html: "xml", xml: "xml", css: "css", swift: "swift", go: "go", rs: "rust", java: "java", yml: "yaml", yaml: "yaml", toml: "ini", sql: "sql", c: "c", h: "c", cpp: "cpp", rb: "ruby" }
const langOf = (file) => EXT[(file || "").split(".").pop().toLowerCase()]
// once it arrives, draw again so what is already on screen gets its colors
addEventListener("load", () => { if (current) render(false) })

function outputNode(p, name, command) {
  const show = (v) => (v == null || v === "" ? "" : typeof v === "string" ? v : JSON.stringify(v, null, 2))
  // opencode wraps its own note about a call in <shell_metadata>; the note reads as text
  let text = show(p.output).replace(/<\/?shell_metadata>/g, "").replace(/\n{3,}/g, "\n\n").trim()
  if (name === "bash" || name === "run") text = ["$ " + (command || ""), text].filter((t) => t.trim()).join("\n\n")
  else if (!text) text = show(p.input) === "{}" ? "" : show(p.input)
  if (!text.trim()) return null
  if (text.length > 4000) text = text.slice(0, 4000) + `\n… (${text.length - 4000} more characters)`
  return el("pre", "", text)
}

function fileNode(p) {
  const url = `/file?p=${b64url(p.filePath)}&id=${encodeURIComponent(current)}&token=${token}`
  if ((p.mimeType || "").startsWith("image/")) {
    const img = el("img")
    img.src = url

  }
  const a = el("a", "", "📎 " + (p.fileName || p.filePath.split("/").pop()))

function askNode(a) {
  const node = el("div", "ask")
  node.append(el("strong", "", a.title))
  if (a.detail) node.append(el("div", "detail", a.detail))
  for (const q of a.questions?.length > 1 ? a.questions : []) node.append(el("div", "detail", q.title))
  const row = el("div")
  for (const o of a.options) {
    const b = el("button", "", o.label)
    const answer = () => call("/respond", { id: current, askID: a.id, optionID: o.id }).then(readHistory)
    b.onclick = () => answer().catch((err) => fail(err, answer))
    row.append(b)
  }

}

$("compose").onsubmit = (e) => {
  e.preventDefault()
  if (editing) return void saveEdit()
  const text = $("input").value.trim()
  const files = attachments.filter((file) => file.id).map((file) => file.id)
  if ((!text && !files.length) || !current || attachments.some((file) => file.uploading)) return
  $("input").value = ""
  grow()
  saveDraft()
  const id = current
  const into = busy()
  // words typed while an ask waits are the answer: stand the ask down so the turn can go on
  for (const a of asks) call("/reject", { id, askID: a.id }).catch(() => {})
  asks = []
  const pending = { text: text || "see the attached file", files, id: uuid(), failed: false, retry: null }
  // into a running turn: steer it in at the next tool step (the default), wait
  // for the turn to end, or stop the turn and run this now
  const mode = into ? $("compose").querySelector("input[name=mode]:checked").value : "steer"
  const how = { steer: {}, after: { steer: false }, now: { force: true } }[mode]
  pending.expectQueue = into && mode !== "now"
  pending.steer = mode === "steer"
  pendingText.push(pending)
  attachments = []
  renderAttachments()
  render()
  $("scroll").scrollTop = $("scroll").scrollHeight
  // the answer comes back when the whole turn ends; the feed shows it sooner
  sendPending(id, pending, how)
}

$("input").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault()
    $("compose").requestSubmit()
  } else if (e.key === "Escape" && editing) {
    e.preventDefault()
    endEdit()
  } else if (e.key === "ArrowUp" && !e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey && !editing && !$("input").value) {
    // as in Slack: up in an empty box edits the last message still waiting
    const mine = pendingText.filter((p) => p.clientID && (p.expectQueue || queue.some((q) => q.clientID === p.clientID)))
    const last = mine[mine.length - 1] ?? [...queue].reverse().find((q) => q.clientID)
    if (last) { e.preventDefault(); startEdit({ clientID: last.clientID, text: last.text }) }
  }
}
const grow = () => { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px" }
$("input").oninput = () => { grow(); saveDraft() }

// what was typed and not sent stays with its conversation, across reloads
const draftKey = (id) => "jep.draft." + id
function saveDraft() {
  if (!current || editing) return
  const text = $("input").value
  try { text.trim() ? localStorage.setItem(draftKey(current), text) : localStorage.removeItem(draftKey(current)) } catch {}
}

// ── the queue ─────────────────────────────────────────────────────────────
// A message waiting for its turn stays where it was said, dimmed, and says so
function queuedMark(node, q) {
  node.classList.add("queued-msg")
  node.dataset.info = q.steer ? "goes in at the next step" : "runs after this turn"
  if (!q.clientID) return
  if (editing?.clientID === q.clientID) node.classList.add("editing")
  const actions = el("div", "queued-actions")
  const edit = el("button", "", "Edit")
  edit.type = "button"
  edit.onclick = () => startEdit(q)
  const cancel = el("button", "", "Cancel")
  cancel.type = "button"
  cancel.onclick = () => { cancel.disabled = true; cancelQueued(q.clientID) }
  actions.append(edit, cancel)
  node.querySelector(".body").append(actions)
}

// Editing a queued message happens in the message box, which no redraw
// touches: its words go there, Enter saves them back into the line, Esc
// puts back whatever was being typed before.
let editing = null // { clientID, session, before }
const editBar = el("div", "editing-bar")
editBar.hidden = true
function startEdit(q) {
  if (!q?.clientID || !current) return
  if (editing) endEdit()
  editing = { clientID: q.clientID, session: current, before: $("input").value }
  const close = el("button", "link", "Cancel")
  close.type = "button"
  close.onclick = () => endEdit()
  editBar.replaceChildren(el("span", "", "Editing a queued message · Enter saves · Esc cancels"), close)
  editBar.hidden = false
  $("compose").insertBefore(editBar, $("compose").querySelector(".box"))
  $("input").value = q.text
  grow()
  $("input").focus()
  $("input").setSelectionRange(q.text.length, q.text.length)
  render()
}
function endEdit(keep = false) {
  if (!editing) return
  const before = editing.before
  editing = null
  editBar.hidden = true
  if (!keep) $("input").value = before
  grow()
  render()
}
async function saveEdit() {
  const { clientID, session } = editing
  const text = $("input").value.trim()
  const p = pendingText.find((x) => x.clientID === clientID)
  const q = queue.find((x) => x.clientID === clientID)
  const old = p?.text ?? q?.text
  if (!text || text === old) return endEdit()
  // the new words show at once; the daemon's line is the one that counts
  if (p) p.text = text
  if (q) q.text = text
  endEdit()
  try {
    await call("/queue/edit", { id: session, clientID, text })
  } catch (err) {
    // too late: it already started with the old words. Nothing typed is lost:
    // the new words wait in the box, to send as a message of their own.
    if (p) p.text = old
    if (q) q.text = old
    if (session === current) {
      const typed = $("input").value.trim()
      $("input").value = [text, ...(typed ? [typed] : [])].join("\n\n")
      grow()
      saveDraft()
    }
    fail(new Error(/running|not queued/.test(err.message) ? "That message already started. Your edit is in the message box, to send on its own." : err.message))
  }
  if (session === current) { etag = null; readHistory().catch(() => {}) }
}

// Prompts sent "after this turn" wait in the daemon's line, and the next turn
// runs them together, their words in line order. The line shows over the
// composer: drag a row, or use its arrows, to change the order; × takes one
// out. A row from a client that gave no handle (Telegram) cannot be moved.
let queueShown = ""
let dragging = null

function renderQueue() {
  const key = JSON.stringify(queue)
  if (key === queueShown || dragging) return
  queueShown = key
  const box = $("queue")
  box.hidden = queue.length < 2
  if (queue.length < 2) return box.replaceChildren()
  const head = el("div", "queue-head", `Queued · ${queue.length}`)
  box.replaceChildren(head, ...queue.map((q, i) => {
    const row = el("div", "queued")
    const handle = !!q.clientID
    row.draggable = handle && queue.length > 1
    const grip = el("span", "grip")
    grip.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>'
    const text = el("span", "queued-text", q.text.replace(/\s+/g, " "))
    text.title = q.text
    row.append(grip, text, el("small", "", q.steer ? "next step" : "after turn"))
    const button = (label, path, disabled, act) => {
      const b = el("button", "icon")
      b.type = "button"; b.title = label; b.setAttribute("aria-label", label); b.disabled = disabled
      b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`
      b.onclick = act
      return b
    }
    row.append(
      button("Move up", "M6 15l6-6 6 6", !handle || i === 0, () => moveQueued(q.clientID, i - 1)),
      button("Move down", "M6 9l6 6 6-6", !handle || i === queue.length - 1, () => moveQueued(q.clientID, i + 1)),
      button("Remove from the queue", "M6 6l12 12M18 6 6 18", !handle, () => cancelQueued(q.clientID)),
    )
    row.ondragstart = (e) => { dragging = q.clientID; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move" }
    row.ondragend = () => { dragging = null; row.classList.remove("dragging"); queueShown = ""; renderQueue() }
    row.ondragover = (e) => {
      if (!dragging) return
      e.preventDefault()
      const below = e.offsetY > row.offsetHeight / 2
      for (const r of box.querySelectorAll(".queued")) r.classList.remove("drop-above", "drop-below")
      row.classList.add(below ? "drop-below" : "drop-above")
    }
    row.ondrop = (e) => {
      e.preventDefault()
      const from = queue.findIndex((x) => x.clientID === dragging)
      let to = i + (row.classList.contains("drop-below") ? 1 : 0)
      if (from < to) to--
      const id = dragging
      dragging = null
      if (from >= 0 && to !== from) moveQueued(id, to)
      else { queueShown = ""; renderQueue() }
    }
    return row
  }))
}

async function moveQueued(clientID, to) {
  const id = current
  const from = queue.findIndex((q) => q.clientID === clientID)
  if (from < 0) return
  // move it on screen at once; the daemon's answer is the order that counts
  const next = [...queue]
  next.splice(to, 0, ...next.splice(from, 1))
  queue = next
  renderQueue()
  try {
    const res = await call("/queue/move", { id, clientID, to })
    if (id === current && res.queue) { queue = res.queue; renderQueue() }
  } catch (err) {
    fail(err)
    if (id === current) { etag = null; readHistory().catch(() => {}) }
  }
}

async function cancelQueued(clientID) {
  const id = current
  queue = queue.filter((q) => q.clientID !== clientID)
  pendingText = pendingText.filter((p) => p.clientID !== clientID)
  render()
  try { await call("/queue/cancel", { id, clientID }) } catch (err) { fail(err) }
  if (id === current) { etag = null; readHistory().catch(() => {}) }
}

// Stop ends the turn and everything waiting behind it; otherwise the next
// waiting message starts the moment this one ends, and Stop looks like it did
// nothing. What was waiting comes back into the composer, so no words are lost.
function stopAll() {
  const id = current
  return call("/stop", { id, all: true }).then(({ dropped = [] }) => {
    const ours = new Set(dropped)
    pendingText = pendingText.filter((p) => !ours.has(p.text))
    queue = []
    if (id !== current || !dropped.length) return render()
    const typed = $("input").value.trim()
    $("input").value = [...dropped, ...(typed ? [typed] : [])].join("\n\n")
    grow()
    saveDraft()
    render()
  })
}
$("stop").onclick = () => stopAll().catch((err) => fail(err, stopAll))
$("back").onclick = () => { location.hash = "" }

// ── the live feed ─────────────────────────────────────────────────────────
let feed = null
let reread = null

function follow() {
  feed?.close()
  feed = new EventSource(`/stream?token=${token}`)
  feed.onmessage = (m) => {
    const evt = JSON.parse(m.data)
    if (evt.type === "ask.requested" && evt.ask?.sessionID !== current) notifyAsk(evt.ask)
    if (evt.type === "session.idle" || evt.type === "turn.aborted") {
      if (evt.type === "session.idle" && evt.sessionID !== current) notifyAnswer(evt.sessionID)
      settle(evt.sessionID)
      renderSessions()
      if (evt.sessionID === current) frame()
    }
    if (evt.type === "session.idle" || evt.type === "turn.aborted" || evt.type === "session.changed") loadSessions().catch((err) => fail(err, loadSessions))
    if (evt.sessionID !== current) return
    if (evt.role) roles.set(evt.messageID, evt.role)
    // our own words are already on screen; only the reply streams
    if (evt.partID && roles.get(evt.messageID) === "user") return
    if (evt.type === "part.delta" && (evt.partType ?? "text") === "text") {
      const l = live.get(evt.partID) ?? { messageID: evt.messageID, part: { kind: "text", text: "", id: evt.partID } }
      if (l.part.kind === "text") l.part.text += evt.text
      live.set(evt.partID, l)
      return void frame()
    }
    if (evt.type === "part.updated" && evt.part) {
      live.set(evt.partID, { messageID: evt.messageID, part: { ...evt.part, id: evt.partID } })
      frame()
    }
    if (evt.type === "session.idle" || evt.type === "turn.aborted") { markSeen(); loadStatus() }
    if (evt.type === "session.error") {
      if (evt.sessionID !== current) notifyFailure(evt.sessionID, evt.message)
      fail(new Error(evt.message))
    }
    // the record itself moved: read it again, but not on every event
    clearTimeout(reread)
    reread = setTimeout(() => readHistory().catch((err) => fail(err, readHistory)), 400)
  }
  // EventSource reconnects by itself; a reread catches what was missed
  feed.onopen = () => { setHealth("online", "Connected", "Live event stream connected"); readHistory().catch((err) => fail(err, readHistory)) }
  feed.onerror = () => setHealth("warn", "Reconnecting…", "The live event stream disconnected; retrying automatically")
}

let framed = false
const frame = () => { if (!framed) { framed = true; requestAnimationFrame(() => { framed = false; render() }) } }

// ── small things ──────────────────────────────────────────────────────────
function el(tag, cls = "", text) {
  const n = document.createElement(tag)
  if (cls) n.className = cls
  if (text != null) n.textContent = text
  return n
}

function fold(label, text) {
  const d = el("details")
  d.append(el("summary", "", label))
  if (text) d.append(el("pre", "", text))
  return d
}

const textOf = (m) => m.parts.filter((p) => p.kind === "text").map((p) => p.text).join("").trim()
const b64url = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")

function ago(t) {
  const s = (Date.now() - t) / 1000
  if (s < 60) return "now"
  if (s < 3600) return `${Math.floor(s / 60)}m`
  if (s < 86400) return `${Math.floor(s / 3600)}h`
  return `${Math.floor(s / 86400)}d`
}

// outside the log, which every render rebuilds; the same words twice show once
// An error shows as a toast for a few seconds, then folds into the mark at the
// bottom left; the mark opens the list of recent ones. Nothing moves the layout.
const errors = []

const notificationsEnabled = (key) => remembered(`jep.notify.${key}`) !== "false"
const stripMarkdown = (value) => String(value || "")
  .replace(/```[^\n]*\n?/g, "")
  .replace(/`([^`]+)`/g, "$1")
  .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")
  .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
  .replace(/^\s{0,3}#{1,6}\s+/gm, "")
  .replace(/^\s{0,3}>\s?/gm, "")
  .replace(/^\s*[-*+]\s+/gm, "")
  .replace(/^\s*\d+\.\s+/gm, "")
  .replace(/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/gm, "")
  .replace(/<[^>]*>/g, "")
  .replace(/\s*\|\s*/g, " · ")
  .replace(/[*_~]/g, "")
const preview = (value, max = 140) => {
  const text = stripMarkdown(value).replace(/\s+/g, " ").trim()
  return text.length > max ? text.slice(0, max - 1).trimEnd() + "…" : text
}

function browserNotice(title, body, id, setting) {
  if (!document.hidden || !notificationsEnabled(setting) || !window.Notification || Notification.permission !== "granted") return
  try {
    const n = new Notification(title, { body: preview(body), tag: `jep-${setting}-${id}` })
    n.onclick = () => { window.focus(); location.hash = encodeURIComponent(id); n.close() }
  } catch {}
}

function sessionLabel(id) {
  return sessions.find((s) => s.id === id)?.title || "another chat"
}

function noticeNode(title, body, id, timeout) {
  const n = el("div", "notice")
  const copy = el("div", "notice-copy")
  copy.append(el("div", "notice-title", title), el("div", "notice-body", preview(body)))
  // the whole card opens the chat; only × does not
  n.setAttribute("role", "button")
  n.tabIndex = 0
  n.title = "Open"
  const go = () => { n.remove(); location.hash = encodeURIComponent(id) }
  n.onclick = go
  n.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go() } }
  const dismiss = el("button", "dismiss", "×")
  dismiss.type = "button"
  dismiss.title = "Dismiss"
  dismiss.onclick = (e) => { e.stopPropagation(); n.remove() }
  n.append(copy, dismiss)
  $("notices").append(n)
  let timer = setTimeout(() => n.remove(), timeout)
  n.addEventListener("mouseenter", () => clearTimeout(timer))
  n.addEventListener("mouseleave", () => { timer = setTimeout(() => n.remove(), timeout) })
  return n
}

async function notifyAnswer(id) {
  if (!id || id === current) return
  let body = "A new answer is ready."
  try {
    const data = await call("/history", { id, limit: 10 })
    const answer = [...(data.messages || [])].reverse().find((m) => m.role === "assistant")
    body = answer ? (textOf(answer) || body) : body
  } catch {}
  if (id === current) return
  const title = sessionLabel(id)
  noticeNode(title, body, id, 8000)
  browserNotice(`jep · ${title}`, body, id, "answers")
}

function notifyAsk(ask) {
  if (!ask?.sessionID || ask.sessionID === current) return
  const title = sessionLabel(ask.sessionID)
  const body = ask.title || "This chat needs your input."
  noticeNode(title, body, ask.sessionID, 10000)
  browserNotice(`jep needs your input · ${title}`, body, ask.sessionID, "asks")
}

function notifyFailure(id, message) {
  if (!id || id === current) return
  const title = sessionLabel(id)
  const body = message || "The turn failed."
  noticeNode(title, body, id, 10000)
  browserNotice(`jep turn failed · ${title}`, body, id, "failures")
}

function fail(err, retry) {
  const text = String(err.message || err)
  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  errors.unshift({ time, text })
  errors.length = Math.min(errors.length, 30)
  renderErrors()
  if ([...document.querySelectorAll(".toast")].some((n) => n.querySelector(".message")?.textContent === text)) return
  const n = el("div", "toast")
  n.append(el("span", "message", text))
  if (retry) {
    const b = el("button", "retry", "Retry")
    b.type = "button"
    b.onclick = async () => {
      b.disabled = true
      b.textContent = "Retrying…"
      try {
        await retry()
        n.remove()
        $("errorMark").hidden = !!document.querySelector(".toast")
      } catch (err) {
        n.remove()
        fail(err, retry)
      }
    }
    n.append(b)
  }
  $("errors").insertBefore(n, $("errorLog"))
  $("errorMark").hidden = true
  setTimeout(() => {
    n.remove()
    $("errorMark").hidden = !!document.querySelector(".toast")
  }, 6000)
}

function renderErrors() {
  $("errorLog").replaceChildren(...errors.map((e) => {
    const row = el("div", "", e.text)
    row.prepend(el("time", "", e.time))
    return row
  }))
}

$("errorMark").onclick = () => { $("errorLog").hidden = !$("errorLog").hidden }

// ── the status line and settings ──────────────────────────────────────────
let choices = null   // /models: what this conversation can run on, and what it runs on
let usage = null     // /usage: the whole conversation's tokens and spend

function loadStatus() {
  const id = current
  if (!id) return
  call("/models", { id }).then((c) => { if (id === current) { choices = c; renderStatus() } }).catch((err) => fail(err, loadStatus))
  call("/usage", { id }).then((u) => { if (id === current) { usage = u.usage; renderStatus() } }).catch((err) => fail(err, loadStatus))
}

const short = (ref) => (ref || "").split("/").pop()
const tokens = (n) => (n >= 1e6 ? +(n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n))

// as on the phone: the model of the last reply, the window it filled (input plus
// cache, the prompt the model saw), and what the whole conversation cost
function renderStatus() {
  const last = [...messages].reverse().find((m) => m.role === "assistant" && m.tokens)
  const running = choices?.current || choices?.default
  // a model picked here names itself straight away; otherwise the one that answered last
  const model = short(choices?.current) || short(last?.model) || short(running)
  $("model").textContent = model ? model + " ▾" : choices ? "default model ▾" : ""
  $("model").hidden = !choices && !model
  const used = last ? last.tokens.input + last.tokens.cache.read + last.tokens.cache.write : 0
  const limit = choices?.models?.find((m) => `${m.providerID}/${m.modelID}` === running)?.contextLimit || choices?.contextLimit || 0
  $("context").replaceChildren()
  if (used && limit) {
    const pct = Math.min(100, Math.round((used / limit) * 100))
    const meter = el("span", "meter" + (pct >= 80 ? " high" : ""))
    const fill = el("i")
    fill.style.width = pct + "%"
    meter.append(fill)
    $("context").append(meter, `${tokens(used)} / ${tokens(limit)} (${pct}%)`)
    $("context").title = "Context window used by the last reply"
  } else if (used) $("context").append(`${tokens(used)} context`)
  const spent = usage?.cost || 0
  $("spend").textContent = spent > 0 ? "$" + (spent < 10 ? spent.toFixed(2) : spent.toFixed(0)) : ""
  $("spend").title = usage?.unpriced ? `${usage.unpriced} turns had no price from the harness` : "Spent in this conversation"
}

// one small menu above the composer, opened by whichever control asked for it
let menuFor = null
function showMenu(owner, nodes, right = false) {
  const menu = $("menu")
  menu.replaceChildren(...nodes)
  menu.classList.toggle("right", right)
  menu.hidden = false
  menuFor = owner
}
const toggleMenu = (owner) => { if (!$("menu").hidden && menuFor === owner) { $("menu").hidden = true; return true } return false }
addEventListener("click", (e) => { if (!$("menu").hidden && !e.target.closest("#menu, #model, #mcp, #skills")) $("menu").hidden = true })

function switchRow(label, detail, on, flip) {
  const row = el("label")
  const box = el("input")
  box.type = "checkbox"
  box.checked = on
  box.onchange = () => flip(box.checked).catch((err) => { box.checked = !box.checked; fail(err) })
  const text = el("div", "", label)
  if (detail) text.append(el("small", "", detail))
  row.append(box, text)
  return row
}

function notificationButton() {
  const b = $("enableNotifications")
  if (!("Notification" in window)) {
    b.disabled = true
    b.textContent = "Browser notifications unavailable"
  } else if (Notification.permission === "granted") {
    b.textContent = "Browser notifications enabled"
  } else if (Notification.permission === "denied") {
    b.textContent = "Notifications blocked by browser"
  } else {
    b.textContent = "Enable browser notifications"
  }
}

async function loadDevices() {
  const { devices } = await call("/devices")
  const root = $("devices")
  root.replaceChildren(...(devices.length ? devices.map((d) => {
    const row = el("div", "device")
    const info = el("div", "device-info")
    const name = el("div", "device-name")
    const input = el("input")
    input.value = d.name
    input.maxLength = 80
    input.setAttribute("aria-label", "Device name")
    const label = el("span", "device-name", d.name)
    input.hidden = true
    name.append(label, input)
    info.append(name, el("small", "", (d.current ? "This browser · " : "") + "paired " + new Date(d.pairedAt).toLocaleDateString()))
    const edit = el("button", "", "Rename")
    edit.type = "button"
    edit.onclick = async () => {
      if (input.hidden) {
        input.hidden = false
        label.hidden = true
        input.focus()
        edit.textContent = "Save"
        return
      }
      try {
        const name = input.value.trim()
        await call("/devices/rename", { id: d.id, name })
        label.textContent = name
        input.hidden = true
        label.hidden = false
        edit.textContent = "Rename"
      } catch (err) { fail(err) }
    }
    const revoke = el("button", "danger", d.current ? "Unpair" : "Revoke")
    revoke.type = "button"
    revoke.onclick = async () => {
      if (!confirm((d.current ? "Unpair this browser" : "Revoke " + d.name) + "?")) return
      try {
        const result = await call("/devices/revoke", { id: d.id })
        if (result.current) unpair("This browser was revoked.")
        else loadDevices().catch((err) => fail(err))
      } catch (err) { fail(err) }
    }
    row.append(info, edit, revoke)
    return row
  }) : [el("span", "spin", "No paired devices.")]))
}

// the MCP servers this conversation's harness starts, from its own config
$("mcp").onclick = async () => {

      : [el("div", "empty", "No MCP servers configured for this harness.")])])

// the skills this harness loads; where it can, each can be hidden from the model
$("skills").onclick = async () => {
  if (toggleMenu("skills")) return
  const id = current
  showMenu("skills", [el("h4", "", "Skills"), el("div", "empty", "Loading…")])
  try {
    const { skills, toggleable } = await call("/skills", { id })
    if (id !== current || menuFor !== "skills") return
    showMenu("skills", [el("h4", "", "Skills"), ...(skills.length
      ? skills.map((k) => {
        const row = switchRow(k.name, k.description, !k.disableModelInvocation, (on) => call("/setskill", { id, path: k.path, disabled: !on }))
        row.querySelector("input").disabled = !toggleable
        return row
      })
      : [el("div", "empty", "No skills found for this harness.")])])
  } catch (err) { $("menu").hidden = true; fail(err) }
}

$("newHere").onclick = () => $("attachInput").click()

}

async function remove(s) {
  if (!confirm(`Delete "${s.title || "untitled"}" from the harness? This cannot be undone.`)) return
  try {
    await call("/delete", { id: s.id })
    sessions = sessions.filter((x) => x.id !== s.id)
    renderSessions()
    if (s.id === current) location.hash = ""
    loadSessions().catch(() => {})
  } catch (err) { fail(err) }
}

  if (toggleMenu("model")) return
  if (!choices) return
  const pick = (ref) => async () => {
    $("menu").hidden = true

      await call("/setmodel", ref ? { id: current, model: ref } : { id: current })
      loadStatus()
    } catch (err) { fail(err) }

  const item = (label, note, on, ref) => {
    const b = el("button", on ? "on" : "", (on ? "✓ " : "") + label)

    if (note) b.append(el("span", "", note))

  }
  showMenu("model", [
    item(`Default · ${short(choices.default) || "harness"}`, "", !choices.current, null),

$("gear").onclick = async () => {
  const id = current
  const s = sessions.find((x) => x.id === id)
  $("rename").value = s?.title || ""
  $("notifyAnswers").checked = notificationsEnabled("answers")
  $("notifyAsks").checked = notificationsEnabled("asks")
  $("notifyFailures").checked = notificationsEnabled("failures")
  notificationButton()
  renderLoop()
  $("settings").showModal()
  loadDevices().catch((err) => fail(err))
  const [agents, harness] = await Promise.all([
    call("/agents", { id }).catch(() => null),
    call("/harness-settings", { id }).catch(() => null),
  ])
  if (id !== current) return
  // agents: only when the harness offers a choice
  $("agentSection").hidden = !agents?.agents?.length
  if (agents?.agents?.length) {
    const none = el("option", "", `Default${agents.default ? " · " + agents.default : ""}`)
    none.value = ""
    $("agent").replaceChildren(none, ...agents.agents.map((a) => {
      const o = el("option", "", a.label || a.id)
      o.value = a.id
      return o
    }))
    $("agent").value = agents.current || ""
  }
  // the switches the harness declares, each saved the moment it flips
  $("toggleSection").hidden = !harness?.options?.length
  $("toggles").replaceChildren(...(harness?.options || []).map((o) => {
    const label = el("label", "toggle")
    const box = el("input")
    box.type = "checkbox"
    box.checked = harness.values?.[o.id] ?? o.default
    box.onchange = () => call("/set-harness-setting", { id, key: o.id, enabled: box.checked }).catch((err) => { box.checked = !box.checked; fail(err) })
    const text = el("div", o.danger ? "danger" : "", o.label)
    if (o.description) text.append(el("small", "", o.description))
    label.append(box, text)
    return label
  }))
  $("compact").hidden = !harness?.compact
  const u = usage
  $("usage").textContent = u
    ? `${tokens(u.total || 0)} tokens over ${u.turns} ${u.turns === 1 ? "turn" : "turns"}${u.cost ? " · $" + u.cost.toFixed(2) : ""}${u.models?.length ? " · " + u.models.map(short).join(", ") : ""}`
    : "No usage reported yet"
}
