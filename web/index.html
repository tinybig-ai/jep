$("unpair").onclick = () => { if (confirm("Unpair this browser? You will need a pairing code again.")) { $("settings").close(); unpair() } }
$("closeSettings").onclick = () => $("settings").close()
// A click outside the settings is Done. Outside is the dialog itself (its
// backdrop belongs to it), and only when the press began there too: a drag
// that starts selecting in the title box and ends past the edge is not one.
let pressedOutside = false
$("settings").addEventListener("mousedown", (e) => { pressedOutside = e.target === $("settings") && outsideBox(e) })
$("settings").addEventListener("click", (e) => { if (pressedOutside && e.target === $("settings") && outsideBox(e)) $("settings").close() })
function outsideBox(e) {
  const r = $("settings").getBoundingClientRect()
  return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom
}

const markSeen = () => { if (current && !document.hidden) call("/seen", { id: current }).catch(() => {}) }

function remembered(key) { try { return localStorage.getItem(key) } catch { return null } }
function remember(key, value) { try { localStorage.setItem(key, value) } catch {} }

// Markdown, the little of it a chat needs: code blocks, inline code, bold, links.
  // Everything is escaped first, so the text can never become markup.
  // Markdown through marked (GitHub's flavor: tables, lists, headings, task
  // lists), then DOMPurify, so whatever a reply holds can never become script.
  // Until both have loaded, the few marks a chat needs most are drawn by hand.
  const rendered = new Map() // source → html, so a redraw does not parse again
  // Last good parse per messageID (for streaming): keeps a valid table on screen
  // while the next delta arrives incomplete. Like Android's retainState = true.
  const lastGood = new Map() // messageID → html
const completeLink = (value) => {
  if (!value || value !== value.trim() || /\s/.test(value)) return null
  try {
    const url = new URL(value)
    return url.protocol === "http:" || url.protocol === "https:" ? value : null
  } catch { return null }
}

function textNode(src, messageID, hold) {
  const n = el("div", "text")
  if (!window.marked || !window.DOMPurify) {
    n.classList.add("plain")
    n.innerHTML = roughMarkdown(src)
    return n
  }
  let html = rendered.get(src)
  if (html === undefined) {
    html = DOMPurify.sanitize(marked.parse(src, { gfm: true, breaks: true }))
    if (rendered.size > 2000) rendered.clear()
    rendered.set(src, html)
  }
  // An assistant message keeps the last render that had a table. Streaming hands
  // the same message between the live row and the record, and a poll can report
  // the turn idle for a frame mid-stream — keying the hold by message id and
  // never releasing it on a transient state keeps the table from collapsing to
  // text. A finalized message parses to the same table, so the entry is just a
  // re-render of the truth by then.
  if (messageID && hold) {
    if (/<table\b/i.test(html)) { lastGood.set(messageID, html); if (lastGood.size > 2000) lastGood.clear() }
    else if (lastGood.has(messageID)) html = lastGood.get(messageID)
  }
  n.innerHTML = html
  for (const code of n.querySelectorAll("pre > code")) {
    const lang = (/language-([\w+#.-]+)/.exec(code.className)?.[1] || "").toLowerCase()
    code.innerHTML = highlighted(code.textContent.replace(/\n$/, ""), EXT[lang] || lang)
    code.classList.add("hljs")
  }
  for (const code of n.querySelectorAll("code")) {
    if (code.parentElement?.tagName === "PRE") continue
    const url = completeLink(code.textContent)
    if (!url) continue
    const a = el("a", "", code.textContent)
    a.href = url
    a.target = "_blank"
    a.rel = "noreferrer"
    code.replaceWith(a)
  }
  for (const a of n.querySelectorAll("a[href]")) { a.target = "_blank"; a.rel = "noreferrer" }
  // a wide table scrolls on its own instead of widening the page
  for (const t of n.querySelectorAll("table")) {
    const wrap = el("div", "table")
    t.replaceWith(wrap)
    wrap.append(t)
  }
  return n
}

function roughMarkdown(src) {
  const inline = (s) => esc(s)
    .replace(/`([^`\n]+)`/g, (_, code) => {
      const raw = code.replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      const url = completeLink(raw)
      return url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">${code}</a>` : `<code>${code}</code>`
    })
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
  // split keeps each fence's language, so the pieces go text, language, code, text…
  const pieces = src.split(/```([\w+#.-]*)[^\n]*\n?/)
  let html = ""
  for (let i = 0; i < pieces.length; i += 3) {
    html += inline(pieces[i].replace(/^\n/, "").replace(/\n$/, ""))
    if (i + 2 < pieces.length) {
      const lang = (pieces[i + 1] || "").toLowerCase()
      html += `<pre><code class="hljs">${highlighted(pieces[i + 2].replace(/\n$/, ""), EXT[lang] || lang)}</code></pre>`
    }
  }
  return html
}

// ── start ─────────────────────────────────────────────────────────────────
function show() {
  $("pair").hidden = !!token
  document.querySelector("aside").hidden = !token
  document.querySelector("main").hidden = !token
  loadHealth()
  if (!healthTimer) healthTimer = setInterval(loadHealth, 15_000)
  if (!token) return void feed?.close()
  // the last list known, at once; the gateway's answer replaces it when it comes
  try { sessions = JSON.parse(localStorage.getItem("jep.sessions") || "[]") } catch { sessions = [] }
  renderSessions()
  const id = decodeURIComponent(location.hash.slice(1)) || null
  open(id).catch((err) => fail(err, () => open(id)))
  loadSessions().catch((err) => fail(err, loadSessions))
  loadWorkspaces().catch((err) => fail(err, loadWorkspaces))
  follow()
}

window.onhashchange = () => {
  const id = decodeURIComponent(location.hash.slice(1)) || null
  open(id).catch((err) => fail(err, () => open(id)))
}
// the feed already says when a turn ends or a record changes; this only
// catches what it cannot (a conversation started elsewhere). A list costs the
// daemon real work, so not often, and never two at once.
setInterval(() => { if (token && !document.hidden) loadSessions().catch(() => {}) }, 60_000)
show()
